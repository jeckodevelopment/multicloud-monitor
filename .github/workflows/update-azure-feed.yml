name: Update public Azure feed

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/update-azure-feed.yml'
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: azure-public-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify RSS parser
        run: python -m unittest discover -s tests -v
      - name: Inspect public history endpoint format
        run: |
          python - <<'PY'
          import urllib.request, json
          url = "https://azure.status.microsoft/en-us/statushistoryapi/?s"
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"}), timeout=20) as response:
                  data = response.read(300000)
                  print("HISTORY API:",response.status,response.headers.get("Content-Type"),"bytes",len(data))
                  print("RESPONSE SAMPLE:", data[:850].decode("utf-8",errors="replace"))
                  try:
                      obj=json.loads(data)
                      print("JSON STRUCTURE:",type(obj).__name__,list(obj)[:15] if isinstance(obj,dict) else len(obj))
                  except (ValueError,TypeError):
                      pass
          except Exception as exc:
              print("HISTORY API ERROR",repr(exc))
          PY
      - name: Read public Azure RSS
        run: python scripts/update_feed.py
      - name: Commit archive when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/azure-feed.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public Azure incidents archive'
            git push
          fi
