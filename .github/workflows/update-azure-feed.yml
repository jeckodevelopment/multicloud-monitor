name: Update public Azure feed

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: azure-public-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read public Azure RSS
        run: python scripts/update_feed.py
      - name: Commit archive when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/azure-feed.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public Azure incidents archive'
            git push
          fi
