name: Update public Azure feed

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'docs/azure-history-seeds.json'
      - '.github/workflows/update-azure-feed.yml'
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'

permissions:
  contents: write

concurrency:
  group: azure-public-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Report workflow trigger
        run: |
          echo "Trigger: ${{ github.event_name }}"
          echo "UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Expected cadence: 30 minutes (minute 13 and 43 UTC)"
      - name: Verify RSS parser
        run: python -m unittest discover -s tests -v
      - name: Read public Azure RSS
        run: python scripts/update_feed.py
      - name: Commit archive when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/azure-feed.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public Azure incidents archive'
            git push
          fi
